<!DOCTYPE html>
<html>
<head><title>YT Thumb</title></head>
<body>
<h2>YouTube Thumbnail Downloader</h2>
<input id="url" type="text" placeholder="Paste YouTube URL" size="60">
<button onclick="go()">Get Thumbnail</button>
<br><br>
<div id="out"></div>

<script>
function extractId(url) {
  url = url.trim();
  var patterns = [
    /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|v\/|shorts\/)|youtu\.be\/|youtube-nocookie\.com\/embed\/)([A-Za-z0-9_-]{11})/,
    /^([A-Za-z0-9_-]{11})$/
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = url.match(patterns[i]);
    if (m) return m[1];
  }
  return null;
}

function go() {
  var id = extractId(document.getElementById('url').value);
  if (!id) { document.getElementById('out').innerHTML = 'Could not parse video ID.'; return; }
  var max = 'https://i.ytimg.com/vi/' + id + '/maxresdefault.jpg';
  var hq  = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
  document.getElementById('out').innerHTML =
    '<b>Video ID:</b> ' + id + '<br>' +
    '<b>maxresdefault:</b> <a href="' + max + '" target="_blank">' + max + '</a><br>' +
    '<b>hqdefault (fallback):</b> <a href="' + hq + '" target="_blank">' + hq + '</a><br><br>' +
    '<img src="' + max + '" onerror="this.src=\'' + hq + '\'" style="max-width:100%">';
}

document.getElementById('url').addEventListener('keydown', function(e){ if(e.key==='Enter') go(); });
</script>
</body>
</html>
