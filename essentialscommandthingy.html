input[type=text]:focus { border-color: #5865f2; }

.cmd-item:last-child { border-bottom: none; }

.cmd-row input[type=checkbox] { margin-top: 3px; cursor: pointer; accent-color: #5865f2; width: 15px; height: 15px; }
.cmd-info { flex: 1; }
.cmd-head { font-size: 14px; font-weight: 600; font-family: monospace; color: #5865f2; cursor: pointer; }
.cmd-aliases { font-size: 10px; color: #8ea1ff; font-family: monospace; margin-top: 2px; line-height: 1.3; word-break: break-word; }
.cmd-desc { font-size: 12px; color: #ccc; margin-top: 3px; }
.cmd-sub { font-size: 11px; color: #aaa; margin-top: 4px; line-height: 1.3; }
.sub-tag { background: #2a2b32; padding: 1px 5px; border-radius: 3px; font-family: monospace; color: #e1e1e1; font-size: 10px; margin-right: 3px; margin-bottom: 2px; display: inline-block; }
button { width: 100%; margin-top: 20px; padding: 10px; border: none; border-radius: 8px; background: #5865f2; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
button:hover { background: #4752c4; }
.preview { margin-top: 20px; }
textarea { width: 100%; height: 160px; background: #1e1f24; border: 1px solid #444; border-radius: 6px; padding: 10px; color: #57f287; font-family: monospace; font-size: 12px; box-sizing: border-box; resize: vertical; }
.info { font-size: 12px; color: #999; margin-top: 8px; text-align: center; }
a.download { display: block; text-align: center; margin-top: 10px; color: #8ea1ff; text-decoration: none; font-size: 13px; cursor: pointer; }
a.download:hover { text-decoration: underline; }

const selectedSet = new Set();
const searchInput = document.getElementById('searchInput');
const cmdBox = document.getElementById('cmdBox');
const generateBtn = document.getElementById('generateBtn');
const preview = document.getElementById('preview');
const yamlOutput = document.getElementById('yamlOutput');
const infoText = document.getElementById('infoText');
const copyLink = document.getElementById('copyLink');
const downloadLink = document.getElementById('downloadLink');

function render() {
  const q = searchInput.value.toLowerCase().trim();
  cmdBox.innerHTML = '';
  
  commands.filter(c => {
    return !q || c.name.includes(q) || c.desc.toLowerCase().includes(q) || c.aliases.some(a => a.includes(q)) || c.sub.some(s => s.toLowerCase().includes(q));
  }).forEach(c => {
    const item = document.createElement('div');
    item.className = 'cmd-item';
    
    const isChecked = selectedSet.has(c.name);
    let aliasStr = c.aliases.length ? `Aliases: ${c.aliases.map(a => '/' + a).join(', ')}` : '';
    let subStr = c.sub.length ? `Usage: ${c.sub.map(s => `<span class="sub-tag">${s}</span>`).join(' ')}` : '';

    item.innerHTML = `
      <div class="cmd-row">
        <input type="checkbox" id="chk_${c.name}" ${isChecked ? 'checked' : ''}>
        <div class="cmd-info">
          <label for="chk_${c.name}" class="cmd-head">/${c.name}</label>
          ${aliasStr ? `<div class="cmd-aliases">${aliasStr}</div>` : ''}
          <div class="cmd-desc">${c.desc}</div>
          ${subStr ? `<div class="cmd-sub">${subStr}</div>` : ''}
        </div>
      </div>
    `;

    const chk = item.querySelector('input');
    chk.addEventListener('change', () => {
      if (chk.checked) selectedSet.add(c.name);
      else selectedSet.delete(c.name);
    });

    cmdBox.appendChild(item);
  });
}

function getYamlString() {
  const list = Array.from(selectedSet).sort();
  let yaml = 'disabled-commands:\n';
  if (list.length === 0) {
    yaml += '  #- nick\n  #- clear';
  } else {
    list.forEach(name => {
      yaml += `  - ${name}\n`;
    });
  }
  return yaml;
}

function triggerDownload() {
  const yaml = getYamlString();
  const blob = new Blob([yaml], { type: 'text/yaml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'disabled-commands.yml';
  a.click();
  URL.revokeObjectURL(url);
}

function generateAndDownload() {
  const yaml = getYamlString();
  const list = Array.from(selectedSet);
  yamlOutput.value = yaml;
  infoText.innerText = `${list.length} command${list.length === 1 ? '' : 's'} selected to disable`;
  preview.style.display = 'block';
  triggerDownload();
}

copyLink.addEventListener('click', () => {
  yamlOutput.select();
  navigator.clipboard.writeText(yamlOutput.value);
  alert('Copied YAML to clipboard!');
});

downloadLink.addEventListener('click', () => {
  triggerDownload();
});

searchInput.addEventListener('input', render);
generateBtn.addEventListener('click', generateAndDownload);

render();
</script>
</body>
</html>
