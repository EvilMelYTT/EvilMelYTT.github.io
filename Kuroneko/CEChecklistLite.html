<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villager Trading Hall - Enchantment Checklist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding-bottom: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #64b5f6;
            text-shadow: 0 0 10px rgba(100, 181, 246, 0.5);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #90caf9;
        }

        .search-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }

        #search {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            border-radius: 50px;
            border: 2px solid #64b5f6;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        #search:focus {
            box-shadow: 0 0 15px rgba(100, 181, 246, 0.7);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #64b5f6;
        }

        .enchantment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .enchantment-category {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .category-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #64b5f6;
            color: #64b5f6;
        }

        .custom-category .category-title {
            border-bottom: 2px solid #81c784;
            color: #81c784;
        }

        .enchantment-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .enchantment-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .enchantment-checkbox {
            margin-right: 15px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .enchantment-label {
            font-size: 1.1rem;
            cursor: pointer;
            flex-grow: 1;
        }

        .custom-enchantment .enchantment-label {
            color: #81c784;
        }

        .enchantment-item.checked .enchantment-label {
            text-decoration: line-through;
            color: #81c784;
        }

        .custom-enchantment.checked .enchantment-label {
            color: #4caf50;
        }

        .divider {
            grid-column: 1 / -1;
            text-align: center;
            margin: 30px 0 20px;
            position: relative;
        }

        .divider h2 {
            display: inline-block;
            background: #1a1a2e;
            padding: 0 20px;
            color: #81c784;
            font-size: 1.8rem;
            position: relative;
            z-index: 1;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #81c784, transparent);
            z-index: 0;
        }

        @media (max-width: 768px) {
            .enchantment-grid {
                grid-template-columns: 1fr;
            }
            
            .stats {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Villager Trading Hall</h1>
            <p class="subtitle">Enchantment Checklist</p>
        </header>
        
        <div class="search-container">
            <input type="text" id="search" placeholder="Search enchantments...">
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="total-enchantments">0</div>
                <div>Total Enchantments</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="checked-enchantments">0</div>
                <div>Acquired</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="remaining-enchantments">0</div>
                <div>Remaining</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="completion-percent">0%</div>
                <div>Completion</div>
            </div>
        </div>
        
        <div class="enchantment-grid" id="enchantment-container">
        </div>
    </div>

    <script>
        const enchantments = {
            "Weapon Enchantments": [
                "Sharpness",
                "Smite",
                "Bane of Arthropods",
                "Knockback",
                "Fire Aspect",
                "Looting",
                "Sweeping Edge",
                "Breach",
                "Density",
                "Unbreaking",
                "Mending"
            ],
            "Bow Enchantments": [
                "Power",
                "Punch",
                "Flame",
                "Infinity",
                "Unbreaking",
                "Mending"
            ],
            "Crossbow Enchantments": [
                "Multishot",
                "Quick Charge",
                "Piercing",
                "Unbreaking",
                "Mending"
            ],
            "Fishing Rod Enchantments": [
                "Luck of the Sea",
                "Lure",
                "Unbreaking",
                "Mending"
            ],
            "Trident Enchantments": [
                "Impaling",
                "Riptide",
                "Loyalty",
                "Channeling",
                "Unbreaking",
                "Mending"
            ],
            "Armor Enchantments": [
                "Protection",
                "Fire Protection",
                "Blast Protection",
                "Projectile Protection",
                "Feather Falling",
                "Thorns",
                "Unbreaking",
                "Mending"
            ],
            "Helmet Enchantments": [
                "Respiration",
                "Aqua Affinity"
            ],
            "Boot Enchantments": [
                "Depth Strider",
                "Frost Walker",
                "Soul Speed"
            ],
            "Tool Enchantments": [
                "Efficiency",
                "Fortune",
                "Silk Touch",
                "Unbreaking",
                "Mending"
            ],
            "Other Enchantments": [
                "Curse of Binding",
                "Curse of Vanishing"
            ]
        };

        const customEnchantments = {
            "Sword Enchantments": [
                "Hydro Aspect",
                "Inquisitive",
                "Execution",
                "Aerohunts",
                "Miniatures Stomper",
                "Scavenger",
                "Bash",
                "Enraged",
                "Bloodlust",
                "Militia",
                "Crimson",
                "Uppercut",
                "Prowless",
                "Repelation",
                "Venom",
                "Quelling",
                "Armor Crunch",
                "Titanfall",
                "Butchering",
                "Disarmor",
                "Stormhailer",
                "Heart Stealer",
                "Depth Crusher",
                "Cleave",
                "Meltdown",
                "Devourer"
            ],
            "Bow Enchantments": [
                "Strafe",
                "Frenzified",
                "Overloaded",
                "Explosion",
                "Clusterbomb",
                "Whirlwind",
                "Initiator"
            ],
            "Crossbow Enchantments": [
                "Glacial"
            ],
            "Trident Enchantments": [
                "Icetide",
                "Heatwaves"
            ],
            "Tool Enchantments": [
                "Mystical Touch",
                "Moltens Touch",
                "Chopper",
                "Sprees"
            ],
            "Helmet Enchantments": [
                "Satiety",
                "Purification",
                "Rejuvenate"
            ],
            "Chestplate Enchantments": [
                "Aegis",
                "Reflection",
                "Lifebloom"
            ],
            "Boot Enchantments": [
                "Temposwift",
                "Binding",
                "Featherlight"
            ],
            "Pants Enchantments": [
                "Crystallization"
            ]
        };

        function initializeChecklist() {
            const container = document.getElementById('enchantment-container');
            container.innerHTML = '';
            
            for (const [category, items] of Object.entries(enchantments)) {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'enchantment-category';
                
                const categoryTitle = document.createElement('h2');
                categoryTitle.className = 'category-title';
                categoryTitle.textContent = category;
                categoryDiv.appendChild(categoryTitle);
                
                items.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'enchantment-item';
                    
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'enchantment-checkbox';
                    checkbox.id = `ench-${item.replace(/\s+/g, '-').toLowerCase()}`;
                    
                    const isChecked = localStorage.getItem(checkbox.id) === 'true';
                    checkbox.checked = isChecked;
                    
                    checkbox.addEventListener('change', updateStats);
                    
                    const label = document.createElement('label');
                    label.className = 'enchantment-label';
                    label.htmlFor = checkbox.id;
                    label.textContent = item;
                    
                    itemDiv.appendChild(checkbox);
                    itemDiv.appendChild(label);
                    
                    if (isChecked) {
                        itemDiv.classList.add('checked');
                    }
                    
                    categoryDiv.appendChild(itemDiv);
                });
                
                container.appendChild(categoryDiv);
            }
            
            const divider = document.createElement('div');
            divider.className = 'divider';
            divider.innerHTML = '<h2>Custom Enchantments</h2>';
            container.appendChild(divider);
            
            for (const [category, items] of Object.entries(customEnchantments)) {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'enchantment-category custom-category';
                
                const categoryTitle = document.createElement('h2');
                categoryTitle.className = 'category-title';
                categoryTitle.textContent = category;
                categoryDiv.appendChild(categoryTitle);
                
                items.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'enchantment-item custom-enchantment';
                    
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'enchantment-checkbox';
                    checkbox.id = `custom-${item.replace(/\s+/g, '-').toLowerCase()}`;
                    
                    const isChecked = localStorage.getItem(checkbox.id) === 'true';
                    checkbox.checked = isChecked;
                    
                    checkbox.addEventListener('change', updateStats);
                    
                    const label = document.createElement('label');
                    label.className = 'enchantment-label';
                    label.htmlFor = checkbox.id;
                    label.textContent = item;
                    
                    itemDiv.appendChild(checkbox);
                    itemDiv.appendChild(label);
                    
                    if (isChecked) {
                        itemDiv.classList.add('checked');
                    }
                    
                    categoryDiv.appendChild(itemDiv);
                });
                
                container.appendChild(categoryDiv);
            }
            
            updateStats();
        }

        function updateStats() {
            const total = document.querySelectorAll('.enchantment-checkbox').length;
            const checked = document.querySelectorAll('.enchantment-checkbox:checked').length;
            const remaining = total - checked;
            const percent = total > 0 ? Math.round((checked / total) * 100) : 0;
            
            document.getElementById('total-enchantments').textContent = total;
            document.getElementById('checked-enchantments').textContent = checked;
            document.getElementById('remaining-enchantments').textContent = remaining;
            document.getElementById('completion-percent').textContent = `${percent}%`;
            
            document.querySelectorAll('.enchantment-checkbox').forEach(checkbox => {
                localStorage.setItem(checkbox.id, checkbox.checked);
                
                const itemDiv = checkbox.closest('.enchantment-item');
                if (checkbox.checked) {
                    itemDiv.classList.add('checked');
                } else {
                    itemDiv.classList.remove('checked');
                }
            });
        }

        document.getElementById('search').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const items = document.querySelectorAll('.enchantment-item');
            
            items.forEach(item => {
                const label = item.querySelector('.enchantment-label');
                const text = label.textContent.toLowerCase();
                
                if (text.includes(searchTerm)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
            
            document.querySelectorAll('.enchantment-category').forEach(category => {
                const visibleItems = category.querySelectorAll('.enchantment-item');
                const hasVisible = Array.from(visibleItems).some(item => 
                    item.style.display !== 'none'
                );
                
                if (hasVisible) {
                    category.style.display = 'block';
                } else {
                    category.style.display = 'none';
                }
            });
            
            const divider = document.querySelector('.divider');
            const customItems = document.querySelectorAll('.custom-enchantment');
            const hasVisibleCustom = Array.from(customItems).some(item => 
                item.style.display !== 'none'
            );
            
            if (hasVisibleCustom) {
                divider.style.display = 'block';
            } else {
                divider.style.display = 'none';
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            initializeChecklist();
        });
    </script>
</body>
</html>
