<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Villager Trading Hall - Enchantment Checklist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding-bottom: 85px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #64b5f6;
            text-shadow: 0 0 10px rgba(100, 181, 246, 0.5);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #90caf9;
        }

        .search-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }

        #search {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            border-radius: 50px;
            border: 2px solid #64b5f6;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        #search:focus {
            box-shadow: 0 0 15px rgba(100, 181, 246, 0.7);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #64b5f6;
        }

        .enchantment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .enchantment-category {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .category-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #64b5f6;
            color: #64b5f6;
        }

        .custom-category .category-title {
            border-bottom: 2px solid #81c784;
            color: #81c784;
        }

        .enchantment-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .enchantment-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .enchantment-checkbox {
            margin-right: 15px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .enchantment-label {
            font-size: 1.1rem;
            cursor: pointer;
            flex-grow: 1;
        }

        .custom-enchantment .enchantment-label {
            color: #81c784;
        }

        .enchantment-item.checked .enchantment-label {
            text-decoration: line-through;
            color: #81c784;
        }

        .custom-enchantment.checked .enchantment-label {
            color: #4caf50;
        }

        .divider {
            grid-column: 1 / -1;
            text-align: center;
            margin: 30px 0 20px;
            position: relative;
        }

        .divider h2 {
            display: inline-block;
            background: #1a1a2e;
            padding: 0 20px;
            color: #81c784;
            font-size: 1.8rem;
            position: relative;
            z-index: 1;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #81c784, transparent);
            z-index: 0;
        }

        .watermark {
            position: fixed;
            bottom: 10px;
            right: 10px;
            height: 65px;
            width: 350px;
            background: url('https://assets.ppy.sh/user-profile-covers/9938020/c53c8d330ea57b8428ba877ac664601e692ac519e717836e62e5be7a17582a7c.png');
            background-size: cover;
            background-position: center;
            border-radius: 5px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
            font-size: 12px;
            font-family: Arial, sans-serif;
            z-index: 1000;
        }
        .watermark-left {
            position: fixed;
            bottom: 10px;
            left: 10px;
            height: 65px;
            width: 262px;
            background: url('https://i.ibb.co/sdkCDzFD/q9pok1limzv71.jpg');
            background-size: cover;
            background-position: center -70px;
            border-radius: 5px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            font-size: 12px;
            font-family: Arial, sans-serif;
            z-index: 1000;
        }

        .watermark-left-text {
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 10px;
            border-radius: 4px;
        }

        .watermark-text {
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 10px;
            border-radius: 4px;
        }
        #bottom-bar {
            position: fixed;
            bottom: 10px;
            left: 0;
            width: 100%;
            display: flex;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
            z-index: 1000;
            height: 65px;
        }

        .watermark, .watermark-left {
            height: 65px;
            display: flex;
            align-items: center;
        }

        #scroller-container {
            flex: 1;
            height: 65px;
            margin: 0 10px;
            overflow: hidden;
            position: relative;
            border-radius: 5px;
            background: #111;
            border: 2px solid #555; 
        }

        #scroller-track {
            display: flex;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
        }

        #scroller-track img {
            height: 100%;
            margin-right: 5px;
            object-fit: cover;
            flex-shrink: 0;
        }

        #scroller-loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-family: monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            z-index:10;
        }

        @media (max-width: 768px) {
            .enchantment-grid {
                grid-template-columns: 1fr;
            }
            
            .stats {
                flex-direction: column;
                gap: 10px;
            }
            
            #bottom-bar {
                flex-direction: column;
                height: auto;
                position: relative;
                margin-top: 20px;
            }
            
            .watermark, .watermark-left {
                position: relative;
                bottom: auto;
                left: auto;
                width: 100%;
                margin-bottom: 10px;
            }
            
            #scroller-container {
                width: 100%;
                margin: 10px 0;
            }
        }
    </style>
</head>

        function initializeChecklist() {
            const container = document.getElementById('enchantment-container');
            container.innerHTML = '';
            
            for (const [category, items] of Object.entries(enchantments)) {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'enchantment-category';
                
                const categoryTitle = document.createElement('h2');
                categoryTitle.className = 'category-title';
                categoryTitle.textContent = category;
                categoryDiv.appendChild(categoryTitle);
                
                items.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'enchantment-item';
                    
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'enchantment-checkbox';
                    checkbox.id = `ench-${item.replace(/\s+/g, '-').toLowerCase()}`;
                    
                    const isChecked = localStorage.getItem(checkbox.id) === 'true';
                    checkbox.checked = isChecked;
                    
                    checkbox.addEventListener('change', updateStats);
                    
                    const label = document.createElement('label');
                    label.className = 'enchantment-label';
                    label.htmlFor = checkbox.id;
                    label.textContent = item;
                    
                    itemDiv.appendChild(checkbox);
                    itemDiv.appendChild(label);
                    
                    if (isChecked) {
                        itemDiv.classList.add('checked');
                    }
                    
                    categoryDiv.appendChild(itemDiv);
                });
                
                container.appendChild(categoryDiv);
            }
            
            const divider = document.createElement('div');
            divider.className = 'divider';
            divider.innerHTML = '<h2>Custom Enchantments</h2>';
            container.appendChild(divider);
            
            for (const [category, items] of Object.entries(customEnchantments)) {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'enchantment-category custom-category';
                
                const categoryTitle = document.createElement('h2');
                categoryTitle.className = 'category-title';
                categoryTitle.textContent = category;
                categoryDiv.appendChild(categoryTitle);
                
                items.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'enchantment-item custom-enchantment';
                    
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'enchantment-checkbox';
                    checkbox.id = `custom-${item.replace(/\s+/g, '-').toLowerCase()}`;
                    
                    const isChecked = localStorage.getItem(checkbox.id) === 'true';
                    checkbox.checked = isChecked;
                    
                    checkbox.addEventListener('change', updateStats);
                    
                    const label = document.createElement('label');
                    label.className = 'enchantment-label';
                    label.htmlFor = checkbox.id;
                    label.textContent = item;
                    
                    itemDiv.appendChild(checkbox);
                    itemDiv.appendChild(label);
                    
                    if (isChecked) {
                        itemDiv.classList.add('checked');
                    }
                    
                    categoryDiv.appendChild(itemDiv);
                });
                
                container.appendChild(categoryDiv);
            }
            
            updateStats();
        }

        function updateStats() {
            const total = document.querySelectorAll('.enchantment-checkbox').length;
            const checked = document.querySelectorAll('.enchantment-checkbox:checked').length;
            const remaining = total - checked;
            const percent = total > 0 ? Math.round((checked / total) * 100) : 0;
            
            document.getElementById('total-enchantments').textContent = total;
            document.getElementById('checked-enchantments').textContent = checked;
            document.getElementById('remaining-enchantments').textContent = remaining;
            document.getElementById('completion-percent').textContent = `${percent}%`;
            
            document.querySelectorAll('.enchantment-checkbox').forEach(checkbox => {
                localStorage.setItem(checkbox.id, checkbox.checked);
                
                const itemDiv = checkbox.closest('.enchantment-item');
                if (checkbox.checked) {
                    itemDiv.classList.add('checked');
                } else {
                    itemDiv.classList.remove('checked');
                }
            });
        }

        document.getElementById('search').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const items = document.querySelectorAll('.enchantment-item');
            
            items.forEach(item => {
                const label = item.querySelector('.enchantment-label');
                const text = label.textContent.toLowerCase();
                
                if (text.includes(searchTerm)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
            
            document.querySelectorAll('.enchantment-category').forEach(category => {
                const visibleItems = category.querySelectorAll('.enchantment-item');
                const hasVisible = Array.from(visibleItems).some(item => 
                    item.style.display !== 'none'
                );
                
                if (hasVisible) {
                    category.style.display = 'block';
                } else {
                    category.style.display = 'none';
                }
            });
            
            const divider = document.querySelector('.divider');
            const customItems = document.querySelectorAll('.custom-enchantment');
            const hasVisibleCustom = Array.from(customItems).some(item => 
                item.style.display !== 'none'
            );
            
            if (hasVisibleCustom) {
                divider.style.display = 'block';
            } else {
                divider.style.display = 'none';
            }
        });

        ];

        const track = document.getElementById("scroller-track");
        const loading = document.getElementById("scroller-loading");

        let loaded = 0;
        const imgs = [];

        function preloadImages(urls, callback) {
            urls.forEach(url => {
                const img = new Image();
                img.src = url;
                img.onload = () => {
                    loaded++;
                    loading.textContent = `Loading all images ᓚᘏᗢ ${Math.round(loaded / urls.length * 100)}%`;
                    if (loaded === urls.length) callback();
                };
                imgs.push(img);
            });
        }

        function startScroller() {
            loading.style.display = "none";

            imgs.forEach(img => track.appendChild(img));

            imgs.forEach(img => {
                const clone = img.cloneNode();
                track.appendChild(clone);
            });

            let scroll = 0;
            function animate() {
                scroll += 0.5;
                if (scroll >= track.scrollWidth / 2) scroll = 0;
                track.style.transform = `translateX(-${scroll}px)`;
                requestAnimationFrame(animate);
            }
            animate();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initializeChecklist();
            preloadImages(imageUrls, startScroller);
        });
    </script>
