<!DOCTYPE html>
<html>
<head>
<title>YT Thumbnail Downloader</title>
<style>
  @font-face {
    font-family: 'Minecraft';
    src: url('assets/mcui/fonts/minecraft.woff') format('woff'),
         url('assets/mcui/fonts/minecraft.ttf') format('truetype');
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Minecraft', 'Segoe UI', sans-serif;
    margin: 0;
    padding: 1rem 1rem 1.5rem;
    text-align: center;
    background: linear-gradient(135deg, #f7f3f0, #f7f3f0);
    color: #333;
    min-height: 100vh;
    transition: background 0.62s ease, color 0.62s ease;
  }

  body.dark {
    background: linear-gradient(135deg, #1c1c1c, #1c1c1c);
    color: #eaeaea;
  }

  #theme-toggle {
    position: fixed;
    top: 10px;
    left: 10px;
    width: 48px;
    height: 48px;
    cursor: pointer;
    z-index: 10;
    background: none !important;
    border: none;
    padding: 0;
    transition: transform 0.3s ease;
  }

  #theme-toggle:hover { transform: rotate(10deg) scale(1.05); }

  #theme-icon { width: 100%; height: 100%; }

  h1 {
    font-size: 1.3rem;
    margin: 0.5rem 0 0.75rem;
    letter-spacing: 1px;
  }

  .card {
    background: rgba(255,255,255,0.85);
    border-radius: 1rem;
    padding: 0.85rem 1.25rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    max-width: 700px;
    margin: 0 auto 0.65rem;
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }

  body.dark .card {
    background: rgba(30,30,30,0.9);
    box-shadow: 0 4px 20px rgba(255,255,255,0.05);
  }

  .input-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  input[type="text"] {
    flex: 1;
    padding: 0.55rem 0.85rem;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.88rem;
    background: #fff;
    color: #333;
    transition: border-color 0.2s;
    outline: none;
  }

  input[type="text"]:focus { border-color: #f4c9ae; }

  body.dark input[type="text"] {
    background: #1e1e1e;
    color: #f0f0f0;
    border-color: #555;
  }

  body.dark input[type="text"]:focus { border-color: #f7d9c4; }

  button {
    background-color: #f7d9c4;
    border: none;
    border-radius: 8px;
    padding: 0.55rem 1rem;
    font-family: inherit;
    font-weight: bold;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background-color 0.3s, transform 0.2s ease;
    color: #333;
  }

  button:hover { background-color: #f4c9ae; transform: translateY(-2px); }
  button:active { transform: translateY(0); }

  body.dark button:not(#theme-toggle) {
    background-color: #3a3a3a !important;
    color: #eaeaea !important;
  }

  body.dark button:not(#theme-toggle):hover {
    background-color: #4a4a4a !important;
  }

  #output { display: none; }

  .thumb-img {
    width: 100%;
    border-radius: 0.75rem;
    margin-bottom: 0.5rem;
    border: 2px solid #ccc;
    display: block;
    transition: border-radius 0.25s ease, border-color 0.3s;
  }

  .thumb-img.sharp { border-radius: 0; }

  body.dark .thumb-img { border-color: #555; }

  .thumb-options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.55rem;
  }

  .toggle-corners {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    cursor: pointer;
    user-select: none;
    font-size: 0.75rem;
    color: #888;
  }

  body.dark .toggle-corners { color: #aaa; }

  .toggle-corners input[type="checkbox"] { cursor: pointer; margin: 0; }

  .vid-id {
    font-size: 0.75rem;
    color: #888;
    margin: 0 0 0.5rem;
  }

  body.dark .vid-id { color: #aaa; }

  .link-row {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.5);
    border-radius: 8px;
    padding: 0.55rem 0.75rem;
    margin-bottom: 0.4rem;
    gap: 0.6rem;
  }

  body.dark .link-row { background: rgba(50,50,50,0.7); }

  .link-label {
    font-size: 0.75rem;
    font-weight: bold;
    color: #55FFFF;
    flex-shrink: 0;
    width: 82px;
    text-align: left;
  }

  .link-url {
    flex: 1;
    font-size: 0.8rem;
    word-break: break-all;
    text-align: left;
    color: #555;
    padding: 0.15rem 0;
  }

  body.dark .link-url { color: #aaa; }

  .link-url a { color: #0066cc; text-decoration: underline; }

  body.dark .link-url a { color: #f7d9c4; }

  .copy-btn {
    padding: 0.4rem 0.85rem;
    font-size: 0.78rem;
    border-radius: 6px;
    flex-shrink: 0;
  }

  .error {
    color: #c0392b;
    font-size: 0.9rem;
    padding: 0.25rem;
    margin: 0;
  }

  body.dark .error { color: #ff6b6b; }
</style>
</head>
<body>

<button id="theme-toggle" title="Toggle theme"><img id="theme-icon" src="" alt="theme"></button>

<h1>📺 YT Thumbnail Downloader</h1>

<div class="card">
  <div class="input-row">
    <input type="text" id="url" placeholder="Paste any YouTube URL...">
    <button onclick="go()">Get</button>
  </div>
</div>

<div class="card" id="output">
  <p class="vid-id" id="vid-id"></p>
  <img class="thumb-img" id="thumb-img" src="" alt="thumbnail">
  <div class="thumb-options">
    <label class="toggle-corners">
      <input type="checkbox" id="sharp-toggle" onchange="toggleCorners()">
      Square corners
    </label>
  </div>

  <div class="link-row">
    <span class="link-label">maxres</span>
    <span class="link-url"><a id="link-max" href="#" target="_blank"></a></span>
    <button class="copy-btn" onclick="copy('link-max')">Copy</button>
  </div>
  <div class="link-row">
    <span class="link-label">hqdefault</span>
    <span class="link-url"><a id="link-hq" href="#" target="_blank"></a></span>
    <button class="copy-btn" onclick="copy('link-hq')">Copy</button>
  </div>
  <div class="link-row">
    <span class="link-label">sddefault</span>
    <span class="link-url"><a id="link-sd" href="#" target="_blank"></a></span>
    <button class="copy-btn" onclick="copy('link-sd')">Copy</button>
  </div>
</div>

<div class="card" id="error-card" style="display:none">
  <p class="error" id="error-msg"></p>
</div>

<script>
  const themeIcon = document.getElementById('theme-icon');
  let isDark = localStorage.getItem("theme") === "dark";

  if (isDark) {
    document.body.classList.add("dark");
    themeIcon.src = "https://raw.githubusercontent.com/EvilMelYTT/EvilMelYTT.github.io/refs/heads/main/gray.png";
  } else {
    themeIcon.src = "https://raw.githubusercontent.com/EvilMelYTT/EvilMelYTT.github.io/refs/heads/main/cream.png";
  }

  document.getElementById('theme-toggle').addEventListener('click', () => {
    const gifSrc = isDark
      ? "https://raw.githubusercontent.com/EvilMelYTT/EvilMelYTT.github.io/refs/heads/main/fadetocream.gif"
      : "https://raw.githubusercontent.com/EvilMelYTT/EvilMelYTT.github.io/refs/heads/main/fadetogray.gif";
    const finalSrc = isDark
      ? "https://raw.githubusercontent.com/EvilMelYTT/EvilMelYTT.github.io/refs/heads/main/cream.png"
      : "https://raw.githubusercontent.com/EvilMelYTT/EvilMelYTT.github.io/refs/heads/main/gray.png";

    themeIcon.src = gifSrc;
    isDark = !isDark;
    document.body.classList.toggle('dark', isDark);
    localStorage.setItem("theme", isDark ? "dark" : "light");

    const imgClone = new Image();
    imgClone.src = finalSrc;
    imgClone.onload = () => { themeIcon.src = finalSrc; };
  });

  function unwrapGoogleRedirect(url) {
    try {
      const u = new URL(url);
      if ((u.hostname === 'www.google.com' || u.hostname === 'google.com') && u.pathname === '/url') {
        const inner = u.searchParams.get('url') || u.searchParams.get('q');
        if (inner) return decodeURIComponent(inner);
      }
    } catch(e) {}
    return url;
  }

  function extractId(raw) {
    raw = raw.trim();
    raw = unwrapGoogleRedirect(raw);
    const patterns = [
      /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|v\/|shorts\/)|youtu\.be\/|youtube-nocookie\.com\/embed\/)([A-Za-z0-9_-]{11})/,
      /^([A-Za-z0-9_-]{11})$/
    ];
    for (const p of patterns) {
      const m = raw.match(p);
      if (m) return m[1];
    }
    return null;
  }

  function thumb(id, res) {
    return 'https://i.ytimg.com/vi/' + id + '/' + res + '.jpg';
  }

  function go() {
    const val = document.getElementById('url').value;
    const id = extractId(val);
    document.getElementById('error-card').style.display = 'none';
    document.getElementById('output').style.display = 'none';

    if (!id) {
      document.getElementById('error-msg').textContent = 'Could not parse a video ID from that URL.';
      document.getElementById('error-card').style.display = 'block';
      return;
    }

    const max = thumb(id, 'maxresdefault');
    const hq  = thumb(id, 'hqdefault');
    const sd  = thumb(id, 'sddefault');

    document.getElementById('vid-id').textContent = 'Video ID: ' + id;

    const img = document.getElementById('thumb-img');
    img.src = max;
    img.onerror = function() { this.src = hq; this.onerror = null; };

    const lm = document.getElementById('link-max'); lm.href = max; lm.textContent = max;
    const lh = document.getElementById('link-hq');  lh.href = hq;  lh.textContent = hq;
    const ls = document.getElementById('link-sd');  ls.href = sd;  ls.textContent = sd;

    document.getElementById('output').style.display = 'block';
  }

  function toggleCorners() {
    document.getElementById('thumb-img').classList.toggle('sharp', document.getElementById('sharp-toggle').checked);
  }

  function copy(id) {
    const text = document.getElementById(id).textContent;
    navigator.clipboard.writeText(text).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
    });
  }

  document.getElementById('url').addEventListener('keydown', e => {
    if (e.key === 'Enter') go();
  });
</script>
</body>
</html>
